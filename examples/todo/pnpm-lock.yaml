lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@oarkflow/lithe':
        specifier: file:../..
        version: file:../..

packages:

  '@oarkflow/lithe@file:../..':
    resolution: {directory: ../.., type: directory}
    engines: {node: '>=22.6.0'}
    hasBin: true

snapshots:

  '@oarkflow/lithe@file:../..': {}
